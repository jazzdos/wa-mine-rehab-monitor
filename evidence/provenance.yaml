    source_id: dmirs_003_tenements
    resource_url: https://catalogue.data.wa.gov.au/dataset/mining-tenements-dmirs-003
    snapshot_date: "2026-08-16"
    licence_state: public
    evidence_files:
      metadata.txt: c1b52bc81da3908c1eceb43451c7f94db014fcb59215648b8e9fada02da1a916
    context: "CC-BY-4.0 -- in-bundle Licence_CCBY4.pdf"
    units: null
    status: verified
