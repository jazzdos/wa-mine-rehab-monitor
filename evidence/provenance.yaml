# Committed evidence ledger (D13 §8 P2). See src/wa_mine_monitor/evidence.py
# for the schema and the two failure classes (load-time EvidenceError vs.
# a reported VerificationReport failure). Digests and context snippets here
# are copied verbatim from the live data root's SHA256SUMS.txt / metadata.txt
# files; the raw evidence bytes themselves are never committed, only their
# digests and named-file references -- re-verify with:
#   uv run python bin/verify_evidence.py --ledger evidence/provenance.yaml \
#       --data-root <path-to-data-root>
entries:
  # -- dmirs_003_tenements: the gating claim (CC-BY-4.0 grant, required for
  # the public export gate) plus a separate, non-gating archive-integrity
  # entry that only pins the downloaded bundle's digest.
